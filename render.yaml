databases:
  - name: uqo-requests-db
    databaseName: uqo_requests_db
    user: postgres

services:
  - type: web
    name: uqo-requests-backend
    runtime: python
    rootDir: backends
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DB_NAME
        fromDatabase:
          name: uqo-requests-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: uqo-requests-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: uqo-requests-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: uqo-requests-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: uqo-requests-db
          property: port

  - type: web
    name: uqo-requests-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://uqo-requests-backend.onrender.com/api
